  initial_state:
    mode: airborne
    altitude_m: 3.0
    heading_deg: 90
    position_ne_m:
    - -2.0
    - 2.0
    settle_s: 1.0
  command: You are already airborne. Climb to 5 meters, then fly the same square as in the previous plan, pausing for about 1 second at each corner before landing. Do not take off again.
  oracle:
    type: requirements
    require_skills:
    - mu
    forbid_skills:
    - tk
    min_alt_m: 4.2
    min_path_m: 5.5
    min_hover_s: 2.5
    max_end_dist_m: 3.5
  timeout_s: 230
