name: ttf_complex_full
version: 5
description: Complex-command evaluation suite for Talk-to-Fly, revised to keep 25 history-aware and state-aware tasks while removing oracle conditions that can create false negatives for otherwise correct executions. In particular, airborne tasks that ask the vehicle to maintain altitude during the maneuver but also finish by landing no longer use full-episode altitude-range checks, and circle tasks use a slightly more tolerant path-length threshold.
defaults:
  timeout_s: 210
  settle_s: 2.0
  cleanup_mode: land
episodes:
- id: complex_01_ground_prev_square_opposite
  category: complex
  tags:
  - ground_start
  - history_seeded
  - state_aware
  - requires_both
  reset_visible_history: true
  visible_history:
  - 'Previous successful plan: tk(3);sq(2);ld;'
  initial_state:
    mode: ground
    heading_deg: 0
    position_ne_m:
    - 0.0
    - 0.0
  command: You are on the ground now. Take off to 3 meters, repeat the previous 2 meter square in the opposite direction, and land.
  oracle:
    type: requirements
    require_skills:
    - tk
    min_alt_m: 2.2
    min_path_m: 5.5
    max_end_dist_m: 3.0
- id: complex_02_air_prev_square_opposite_keep_alt
  category: complex
  tags:
  - airborne_start
  - history_seeded
  - keep_altitude
  - requires_both
  reset_visible_history: true
  visible_history:
  - 'Previous successful plan: tk(3);sq(2);ld;'
  initial_state:
    mode: airborne
    altitude_m: 3.0
    heading_deg: 45
    position_ne_m:
    - 2.0
    - -1.0
    settle_s: 1.0
  command: You are already airborne, so do not take off again. Fly the previous 2 meter square in the opposite direction while maintaining approximately your current cruising altitude, then land.
  oracle:
    type: requirements
    forbid_skills:
    - tk
    min_alt_m: 2.4
    min_path_m: 5.5
    max_end_dist_m: 3.5
- id: complex_03_air_prev_square_climb_and_hover
  category: complex
  tags:
  - airborne_start
  - history_seeded
  - altitude_change
  - hover
  - requires_both
