      forbid_skills: [tk]
      min_alt_m: 2.8
      max_alt_range_m: 1.3
      min_path_m: 9.0
      min_yaw_abs_deg: 150.0
      max_end_dist_m: 4.0

  - id: complex_14_ground_two_ago_then_previous
