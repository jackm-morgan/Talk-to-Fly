    reset_visible_history: true
    visible_history:
      - "Previous successful plan: tk(4);sq(2);ld;"
    initial_state:
      mode: ground
      heading_deg: 90
      position_ne_m: [1.0, -2.5]
    command: "You are on the ground. Take off to the same altitude used in the previous successful plan, fly that same square in the opposite direction, and land."
    oracle:
      type: requirements
      require_skills: [tk]
      min_alt_m: 3.2
      min_path_m: 6.0
      min_yaw_abs_deg: 150.0
      max_end_dist_m: 3.0

  - id: complex_17_air_two_meters_higher_than_previous_altitude
    category: complex
    tags: [airborne_start, history_seeded, altitude_from_history, altitude_change, requires_both]
