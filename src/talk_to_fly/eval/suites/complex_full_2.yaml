      altitude_m: 3.5
      heading_deg: 225
      position_ne_m: [-3.0, 3.0]
      settle_s: 1.0
    command: "You are already airborne. First fly the previous shape, then fly the shape from two commands ago in the opposite direction, keep your current altitude, and land. Do not take off again."
    oracle:
      type: requirements
      forbid_skills: [tk]
      min_alt_m: 2.8
      max_alt_range_m: 1.3
      min_path_m: 14.0
      min_yaw_abs_deg: 150.0
      max_end_dist_m: 5.0
    timeout_s: 240

  - id: complex_16_ground_use_previous_altitude_and_shape
