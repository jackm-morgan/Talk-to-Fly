      - "Two commands ago: tk(3);sq(2);ld;"
      - "Previous command: tk(3);crc(1.5);ld;"
    initial_state:
      mode: ground
      heading_deg: 45
      position_ne_m: [0.0, -3.0]
    command: "You are on the ground. Take off to 3 meters, fly the shape from two commands ago, then immediately fly the shape from the previous command, and finally land."
    oracle:
      type: requirements
      require_skills: [tk]
      min_alt_m: 2.2
      min_path_m: 14.0
      min_yaw_abs_deg: 150.0
      max_end_dist_m: 5.0
    timeout_s: 240

  - id: complex_15_air_previous_then_two_ago_reverse
