name: ttf_complex_full
version: 3
description: >
  Complex-command evaluation suite for Talk-to-Fly.
  Every episode is controlled and reproducible: each one seeds explicit execution
  history and sets an explicit initial drone state. The tasks are designed to
  require state-aware and history-aware planning rather than isolated one-shot
  command translation.

defaults:
  timeout_s: 210
  settle_s: 2.0
  cleanup_mode: land

episodes:
  - id: complex_01_ground_prev_square_opposite
    category: complex
    tags: [ground_start, history_seeded, state_aware, requires_both]
    reset_visible_history: true
    visible_history:
      - "Previous successful plan: tk(3);sq(2);ld;"
    initial_state:
      mode: ground
      heading_deg: 0
      position_ne_m: [0.0, 0.0]
    command: "You are on the ground now. Take off to 3 meters, repeat the previous 2 meter square in the opposite direction, and land."
    oracle:
      type: requirements
      require_skills: [tk]
      min_alt_m: 2.2
      min_path_m: 6.0
      min_yaw_abs_deg: 150.0
      max_end_dist_m: 2.5

  - id: complex_02_air_prev_square_larger_keep_alt
    category: complex
    tags: [airborne_start, history_seeded, keep_altitude, requires_both]
    reset_visible_history: true
    visible_history:
      - "Previous successful plan: tk(3);sq(2);ld;"
    initial_state:
      mode: airborne
      altitude_m: 3.0
      heading_deg: 45
      position_ne_m: [2.0, -1.0]
      settle_s: 1.0
    command: "You are already airborne, so do not take off again. Repeat the previous square but make the sides 3 meters long, keep your current altitude, and land."
    oracle:
      type: requirements
      forbid_skills: [tk]
      min_alt_m: 2.4
      max_alt_range_m: 1.2
      min_path_m: 9.0
      min_yaw_abs_deg: 150.0
      max_end_dist_m: 3.0

  - id: complex_03_air_prev_square_climb_and_hover
    category: complex
    tags: [airborne_start, history_seeded, altitude_change, hover, requires_both]
    reset_visible_history: true
    visible_history:
      - "Previous successful plan: tk(3);sq(2);ld;"
    initial_state:
      mode: airborne
      altitude_m: 3.0
      heading_deg: 90
      position_ne_m: [-2.0, 2.0]
      settle_s: 1.0
    command: "You are already airborne. Climb to 5 meters, then fly the same square as in the previous plan, pausing for about 1 second at each corner before landing. Do not take off again."
    oracle:
      type: requirements
      require_skills: [mu]
      forbid_skills: [tk]
      min_alt_m: 4.2
      min_path_m: 6.0
      min_yaw_abs_deg: 150.0
      min_hover_s: 3.0
      max_end_dist_m: 3.0
    timeout_s: 230

  - id: complex_04_ground_two_ago_rectangle_repeat
    category: complex
    tags: [ground_start, history_seeded, selection_from_history, requires_both]
    reset_visible_history: true
    visible_history:
      - "Two commands ago: tk(3);mf(4);tcw(90);mf(2);tcw(90);mf(4);tcw(90);mf(2);ld;"
      - "Previous command: tk(3);crc(1.5);ld;"
    initial_state:
      mode: ground
      heading_deg: 30
      position_ne_m: [1.5, 1.0]
    command: "You are on the ground. Take off to 3 meters and repeat the rectangle from two commands ago, then land."
    oracle:
      type: requirements
      require_skills: [tk]
      min_alt_m: 2.2
      min_path_m: 8.0
      min_yaw_abs_deg: 150.0
      max_end_dist_m: 3.0

  - id: complex_05_air_two_ago_rectangle_opposite_keep_alt
    category: complex
    tags: [airborne_start, history_seeded, selection_from_history, keep_altitude, requires_both]
    reset_visible_history: true
    visible_history:
      - "Two commands ago: tk(3);mf(4);tcw(90);mf(2);tcw(90);mf(4);tcw(90);mf(2);ld;"
      - "Previous command: tk(3);crc(1.5);ld;"
    initial_state:
      mode: airborne
      altitude_m: 3.0
      heading_deg: 120
      position_ne_m: [-3.0, 1.5]
      settle_s: 1.0
    command: "You are already airborne. Do not take off again. Fly the rectangle from two commands ago in the opposite direction, keep your current altitude, and land."
    oracle:
      type: requirements
      forbid_skills: [tk]
      min_alt_m: 2.4
      max_alt_range_m: 1.2
      min_path_m: 8.0
      min_yaw_abs_deg: 150.0
      max_end_dist_m: 3.0

  - id: complex_06_ground_complete_partial_square
    category: complex
    tags: [ground_start, partial_history, reasoning_completion, requires_both]
    reset_visible_history: true
    visible_history:
      - "Partial previous execution: tk(2);mf(2);tcw(90);mf(2);"
    initial_state:
      mode: ground
      heading_deg: 0
      position_ne_m: [-1.0, -1.0]
    command: "You are on the ground now. Take off to 2 meters and complete only the remaining two sides of that square before landing."
    oracle:
      type: requirements
      require_skills: [tk]
      min_alt_m: 1.5
      min_path_m: 3.5
      min_yaw_abs_deg: 80.0
      max_end_dist_m: 2.5

  - id: complex_07_air_complete_partial_square
    category: complex
    tags: [airborne_start, partial_history, reasoning_completion, requires_both]
    reset_visible_history: true
    visible_history:
      - "Partial previous execution: tk(2);mf(2);tcw(90);mf(2);"
    initial_state:
      mode: airborne
      altitude_m: 2.0
      heading_deg: 180
      position_ne_m: [3.0, -2.0]
      settle_s: 1.0
    command: "You are already airborne, so do not take off again. Complete only the remaining two sides of that square and then land."
    oracle:
      type: requirements
      forbid_skills: [tk]
      min_alt_m: 1.5
      min_path_m: 3.5
      min_yaw_abs_deg: 80.0
      max_end_dist_m: 2.5

  - id: complex_08_ground_prev_circle_opposite
    category: complex
    tags: [ground_start, history_seeded, circular_reasoning, requires_both]
    reset_visible_history: true
    visible_history:
      - "Previous successful plan: tk(3);crc(1.5);ld;"
    initial_state:
      mode: ground
      heading_deg: 270
      position_ne_m: [0.5, 3.0]
    command: "You are on the ground. Take off to 3 meters, fly the same circle as before but in the opposite direction, and land."
    oracle:
      type: requirements
      require_skills: [tk]
      min_alt_m: 2.2
      min_path_m: 8.0
      max_end_dist_m: 3.0

  - id: complex_09_air_prev_circle_descend_then_reverse
    category: complex
    tags: [airborne_start, history_seeded, altitude_change, circular_reasoning, requires_both]
    reset_visible_history: true
    visible_history:
      - "Previous successful plan: tk(5);crc(1.5);ld;"
    initial_state:
      mode: airborne
      altitude_m: 5.0
      heading_deg: 135
      position_ne_m: [-3.5, -0.5]
      settle_s: 1.0
    command: "You are already airborne. Descend to 3 meters, then fly the same 1.5 meter circle in the opposite direction and land. Do not take off again."
    oracle:
      type: requirements
      require_skills: [md]
      forbid_skills: [tk]
