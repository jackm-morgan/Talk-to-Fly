      min_path_m: 8.0
      max_end_dist_m: 3.0

  - id: complex_10_ground_two_ago_hexagon_repeat
    category: complex
    tags: [ground_start, history_seeded, selection_from_history, polygon, requires_both]
    reset_visible_history: true
    visible_history:
      - "Two commands ago: tk(3);6{mf(1.2);tcw(60)};ld;"
      - "Previous command: tk(3);mf(4);tcw(90);mf(2);tcw(90);mf(4);tcw(90);mf(2);ld;"
    initial_state:
      mode: ground
      heading_deg: 60
      position_ne_m: [2.0, 2.5]
    command: "You are on the ground. Take off to 3 meters and repeat the hexagon from two commands ago, then land."
    oracle:
      type: requirements
      require_skills: [tk]
      min_alt_m: 2.2
      min_path_m: 6.5
      min_yaw_abs_deg: 250.0
      max_end_dist_m: 3.0

  - id: complex_11_air_two_ago_hexagon_higher_opposite
    category: complex
    tags: [airborne_start, history_seeded, selection_from_history, altitude_change, polygon, requires_both]
    reset_visible_history: true
    visible_history:
      - "Two commands ago: tk(3);6{mf(1.2);tcw(60)};ld;"
      - "Previous command: tk(3);mf(4);tcw(90);mf(2);tcw(90);mf(4);tcw(90);mf(2);ld;"
    initial_state:
      mode: airborne
      altitude_m: 3.0
      heading_deg: 210
      position_ne_m: [-1.5, 3.0]
      settle_s: 1.0
    command: "You are already airborne. Climb to 4 meters, then fly the hexagon from two commands ago in the opposite direction and land. Do not take off again."
    oracle:
      type: requirements
      require_skills: [mu]
      forbid_skills: [tk]
      min_alt_m: 3.4
      min_path_m: 6.5
      min_yaw_abs_deg: 250.0
      max_end_dist_m: 3.0

  - id: complex_12_ground_prev_lawnmower_wider
