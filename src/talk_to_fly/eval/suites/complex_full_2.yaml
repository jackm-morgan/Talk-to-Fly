    initial_state:
      mode: airborne
      altitude_m: 3.0
      heading_deg: 30
      position_ne_m: [-2.0, 3.5]
      settle_s: 1.0
    command: "You are already airborne below the altitude used previously. Climb to that same altitude, fly the same circle in the opposite direction, and land. Do not take off again."
    oracle:
      type: requirements
      require_skills: [mu]
      forbid_skills: [tk]
      min_alt_m: 4.2
      min_path_m: 8.0
      max_end_dist_m: 3.0

  - id: complex_19_air_descend_to_previous_square_altitude
    category: complex
    tags: [airborne_start, history_seeded, altitude_from_history, altitude_change, requires_both]
    reset_visible_history: true
    visible_history:
      - "Previous successful plan: tk(3);sq(2);ld;"
    initial_state:
      mode: airborne
      altitude_m: 5.0
      heading_deg: 300
      position_ne_m: [3.5, -3.5]
      settle_s: 1.0
    command: "You are already airborne above the altitude used in the previous successful plan. Descend to that earlier altitude, repeat the square from history, and land. Do not take off again."
    oracle:
      type: requirements
      require_skills: [md]
      forbid_skills: [tk]
      min_alt_m: 2.4
      min_path_m: 6.0
      min_yaw_abs_deg: 150.0
